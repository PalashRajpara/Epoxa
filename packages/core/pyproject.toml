[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epoxa-core"
version = "1.0.0"
description = "Epoxa Shared Core Domain Models, Repositories, Services, and Configuration"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "phonenumbers>=8.13.0",
    "pgvector>=0.2.5",
    "python-dotenv>=1.0.1",
    "supabase>=2.4.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epoxa_core"]
