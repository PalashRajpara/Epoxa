[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epoxa-api"
version = "1.0.0"
description = "Epoxa FastAPI REST & Real-Time SSE Service"
requires-python = ">=3.12"
dependencies = [
    "epoxa-core",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "slowapi>=0.1.9",
    "livekit-api>=0.7.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
    "email-validator>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epoxa_api"]

[tool.uv.sources]
epoxa-core = { workspace = true }
