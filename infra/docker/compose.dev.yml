version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: epoxa-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: epoxa_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - epoxa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epoxa_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: epoxa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/epoxa_dev
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/epoxa_dev
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:8000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-service-key}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"

  agent:
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
    container_name: epoxa-agent
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/epoxa_dev
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEEPGRAM_STT_API_KEY: ${DEEPGRAM_STT_API_KEY}
      DEEPGRAM_TTS_API_KEY: ${DEEPGRAM_TTS_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: epoxa-web
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_LIVEKIT_URL: ${LIVEKIT_URL}

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    container_name: epoxa-dashboard
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

volumes:
  epoxa-postgres-data:
