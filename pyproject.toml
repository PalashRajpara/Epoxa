[project]
name = "epoxa"
version = "0.1.0"
description = "Production-Grade AI Voice Customer Support Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.2",
    "livekit-api>=0.7.0",
    "deepgram-sdk>=3.8.0",
    "groq>=0.11.0",
    "openai>=1.51.0",
    "langgraph>=0.2.34",
    "langchain-core>=0.3.10",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
